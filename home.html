<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Announcement</title>
    <style>
        :root {
            --body-color: #f5f6fa;
            --panel-color: #ffffff;
            --primary-color: #4d62ec;
            --primary-soft: #f6f5ff;
            --text-color: #20242a;
            --text-muted: #707684;
            --border-color: #e9ecf5;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: transparent;
            color: var(--text-color);
            font-family: Inter, Arial, sans-serif;
            padding: 24px;
        }

        .announcement-page {
            min-height: calc(100vh - 48px);
            border-radius: 12px;
            background:
                linear-gradient(135deg, rgba(77, 98, 236, 0.08), rgba(255, 255, 255, 0) 36%),
                var(--panel-color);
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            padding: 28px 44px 34px;
        }

        .announcement-top {
            display: grid;
            grid-template-columns: minmax(120px, 1fr) auto minmax(120px, 1fr);
            align-items: start;
            gap: 20px;
            margin-bottom: 28px;
        }

        .meta-block {
            color: var(--text-muted);
            font-size: 16px;
            font-weight: 600;
            line-height: 1.3;
        }

        .meta-block strong {
            display: block;
            margin-top: 6px;
            color: var(--text-color);
            font-size: 28px;
            font-weight: 800;
        }

        .time-block {
            text-align: right;
        }

        h1 {
            color: var(--text-color);
            font-size: 54px;
            font-weight: 700;
            line-height: 1;
            letter-spacing: 0;
            text-align: center;
        }

        .announce-stack {
            width: min(100%, 1240px);
            margin: 0 auto;
            display: grid;
            gap: 22px;
        }

        .announce-frame {
            overflow: hidden;
            border: 1px solid rgba(77, 98, 236, 0.22);
            border-radius: 14px;
            background: var(--primary-soft);
            box-shadow: 0 16px 34px rgba(77, 98, 236, 0.12);
        }

        .announce-frame img,
        .announce-placeholder {
            display: block;
            width: 100%;
            aspect-ratio: 16 / 9;
        }

        .announce-frame img {
            height: auto;
            object-fit: contain;
            background: #ffffff;
        }

        .announce-placeholder {
            display: grid;
            place-items: center;
            color: #360303;
            background:
                linear-gradient(135deg, rgba(255,255,255,0.16), rgba(255,255,255,0) 34%),
                linear-gradient(135deg, #f9f9f9, #fbfdff);
            font-size: 34px;
            font-weight: 700;
        }

        .download-row {
            width: min(100%, 1240px);
            margin: 26px auto 0;
            padding: 20px 22px;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            background: rgba(255,255,255,0.78);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
        }

        .download-label {
            font-size: 18px;
            font-weight: 700;
        }

        .download-link {
            color: #ffffff;
            background: var(--primary-color);
            border-radius: 8px;
            padding: 10px 16px;
            font-size: 15px;
            font-weight: 700;
            text-decoration: none;
            white-space: nowrap;
        }

        .download-link:hover {
            background: #4054d4;
        }

        @media (max-width: 900px) {
            body {
                padding: 16px;
            }

            .announcement-page {
                min-height: calc(100vh - 32px);
                padding: 22px;
            }

            .announcement-top {
                grid-template-columns: 1fr;
                text-align: center;
            }

            .time-block {
                text-align: center;
            }

            h1 {
                font-size: 40px;
            }

            .download-row {
                align-items: flex-start;
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <main class="announcement-page">
        <header class="announcement-top">
            <div class="meta-block">
                Week no.
                <strong id="weekNo">W---</strong>
            </div>

            <h1>Announcement</h1>

            <div class="meta-block time-block">
                Current time
                <strong id="currentTime">--:--:--</strong>
            </div>
        </header>

        <section class="announce-stack" id="announceStack" aria-label="Announcement images"></section>

        <section class="download-row">
            <div class="download-label">Download : <span id="downloadName">new_tool.xlsm</span></div>
            <a class="download-link" id="downloadLink" href="Tools/new_tool.xlsm" download>Download file</a>
        </section>
    </main>

    <script>
        const announcementImages = [
            "./Announce_img/test_img.png",
            "./Announce_img/test_img.png"
        ];

        const downloadFile = "Tools/new_tool.xlsm";

        function getWeekNo(date) {
            const startOfYear = new Date(date.getFullYear(), 0, 1);
            const dayOfYear = Math.floor((date - startOfYear) / 86400000) + 1;
            const week = Math.ceil(dayOfYear / 7);
            const yearLastDigit = String(date.getFullYear()).slice(-1);

            return `W${yearLastDigit}${String(week).padStart(2, "0")}`;
        }

        function updateDateTime() {
            const now = new Date();
            document.getElementById("weekNo").textContent = getWeekNo(now);
            document.getElementById("currentTime").textContent = now.toLocaleTimeString([], {
                hour: "2-digit",
                minute: "2-digit",
                second: "2-digit"
            });
        }

        function createPlaceholder() {
            const frame = document.createElement("article");
            const placeholder = document.createElement("div");

            frame.className = "announce-frame";
            placeholder.className = "announce-placeholder";
            placeholder.textContent = "Image Placeholder";
            frame.appendChild(placeholder);

            return frame;
        }

        function renderAnnouncementImages() {
            const stack = document.getElementById("announceStack");
            let loadedCount = 0;

            announcementImages.forEach(src => {
                const frame = document.createElement("article");
                const img = document.createElement("img");

                frame.className = "announce-frame";
                img.src = src;
                img.alt = "Announcement slide";
                img.onload = () => {
                    loadedCount += 1;
                };
                img.onerror = () => {
                    frame.remove();
                    if (loadedCount === 0 && stack.children.length === 0) {
                        stack.appendChild(createPlaceholder());
                    }
                };

                frame.appendChild(img);
                stack.appendChild(frame);
            });

            if (announcementImages.length === 0) {
                stack.appendChild(createPlaceholder());
            }
        }

        function setupDownloadLink() {
            const link = document.getElementById("downloadLink");
            const name = document.getElementById("downloadName");

            link.href = downloadFile;
            name.textContent = downloadFile.split("/").pop();
        }

        updateDateTime();
        setInterval(updateDateTime, 1000);
        renderAnnouncementImages();
        setupDownloadLink();
    </script>
</body>
</html>
