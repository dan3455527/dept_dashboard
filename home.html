<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Announcement</title>
    <style>
        :root {
            --body-color: #f5f6fa;
            --panel-color: #ffffff;
            --primary-color: #4d62ec;
            --primary-soft: #f6f5ff;
            --text-color: #20242a;
            --text-muted: #707684;
            --border-color: #e9ecf5;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: transparent;
            color: var(--text-color);
            font-family: Inter, Arial, sans-serif;
            padding: 24px;
        }

        .announcement-page {
            min-height: calc(100vh - 48px);
            border-radius: 12px;
            background:
                linear-gradient(135deg, rgba(77, 98, 236, 0.08), rgba(255, 255, 255, 0) 36%),
                var(--panel-color);
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            padding: 28px 44px 34px;
        }

        .announcement-top {
            display: grid;
            grid-template-columns: minmax(120px, 1fr) auto minmax(120px, 1fr);
            align-items: start;
            gap: 20px;
            margin-bottom: 28px;
        }

        .meta-block {
            color: var(--text-muted);
            font-size: 16px;
            font-weight: 600;
            line-height: 1.3;
        }

        .meta-block strong {
            display: block;
            margin-top: 6px;
            color: var(--text-color);
            font-size: 28px;
            font-weight: 800;
        }

        .time-block {
            text-align: right;
        }

        h1 {
            color: var(--text-color);
            font-size: 54px;
            font-weight: 700;
            line-height: 1;
            letter-spacing: 0;
            text-align: center;
        }

        .announce-layout,
        .announce-stack,
        .announce-carousel {
            width: min(100%, 1240px);
            margin: 0 auto;
        }

        .announce-layout,
        .announce-stack {
            display: grid;
            gap: 22px;
        }

        .announce-stack,
        .announce-carousel {
            width: 100%;
            margin: 0;
        }

        .announce-frame {
            overflow: hidden;
            border: 1px solid rgba(77, 98, 236, 0.22);
            border-radius: 14px;
            background: var(--primary-soft);
            box-shadow: 0 16px 34px rgba(77, 98, 236, 0.12);
        }

        .announce-frame img,
        .announce-placeholder {
            display: block;
            width: 100%;
            aspect-ratio: 16 / 9;
        }

        .announce-frame img {
            height: auto;
            object-fit: contain;
            background: #ffffff;
        }

        .announce-placeholder {
            display: grid;
            place-items: center;
            color: #360303;
            background:
                linear-gradient(135deg, rgba(255,255,255,0.16), rgba(255,255,255,0) 34%),
                linear-gradient(135deg, #f9f9f9, #fbfdff);
            font-size: 34px;
            font-weight: 700;
        }

        .announce-carousel {
            position: relative;
            aspect-ratio: 16 / 9;
        }

        .announce-carousel .announce-frame {
            position: absolute;
            inset: 0;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.45s ease;
        }

        .announce-carousel .announce-frame.active-slide {
            opacity: 1;
            pointer-events: auto;
        }

        .announce-carousel .announce-frame img,
        .announce-carousel .announce-placeholder {
            height: 100%;
        }

        .carousel-arrow {
            position: absolute;
            top: 50%;
            z-index: 5;
            width: 46px;
            height: 64px;
            border: 0;
            border-radius: 10px;
            background: rgba(28, 28, 28, 0.24);
            color: rgba(255, 255, 255, 0.9);
            cursor: pointer;
            font-size: 34px;
            line-height: 1;
            transform: translateY(-50%);
            transition: all 0.2s ease;
        }

        .carousel-arrow:hover {
            background: rgba(28, 28, 28, 0.42);
            color: #ffffff;
        }

        .carousel-prev {
            left: 16px;
        }

        .carousel-next {
            right: 16px;
        }

        .download-row {
            width: min(100%, 1240px);
            margin: 26px auto 0;
            padding: 20px 22px;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            background: rgba(255,255,255,0.78);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
        }

        .download-label {
            font-size: 18px;
            font-weight: 700;
        }

        .download-link {
            color: #ffffff;
            background: var(--primary-color);
            border-radius: 8px;
            padding: 10px 16px;
            font-size: 15px;
            font-weight: 700;
            text-decoration: none;
            white-space: nowrap;
        }

        .download-link:hover {
            background: #4054d4;
        }

        @media (max-width: 900px) {
            body {
                padding: 16px;
            }

            .announcement-page {
                min-height: calc(100vh - 32px);
                padding: 22px;
            }

            .announcement-top {
                grid-template-columns: 1fr;
                text-align: center;
            }

            .time-block {
                text-align: center;
            }

            h1 {
                font-size: 40px;
            }

            .download-row {
                align-items: flex-start;
                flex-direction: column;
            }

            .carousel-arrow {
                width: 38px;
                height: 54px;
                font-size: 28px;
            }
        }
    </style>
</head>
<body>
    <main class="announcement-page">
        <header class="announcement-top">
            <div class="meta-block">
                Week no.
                <strong id="weekNo">W---</strong>
            </div>

            <h1>Announcement</h1>

            <div class="meta-block time-block">
                Current time
                <strong id="currentTime">--:--:--</strong>
            </div>
        </header>

        <section class="announce-layout" id="announcementOutput" aria-label="Announcement images"></section>

        <template id="announcementTemplate">
            <stack>
                <carousel>
                    <slide src="./Announce_img/test_img1.png"></slide>
                    <slide src="./Announce_img/test_img2.png"></slide>
                </carousel>
                <slide src="./Announce_img/test_img1.png"></slide>
            </stack>
        </template>

        <section class="download-row">
            <div class="download-label">Download : <span id="downloadName">new_tool.xlsm</span></div>
            <a class="download-link" id="downloadLink" href="Tools/ne_tool.xlsm" download>Download file</a>
        </section>
    </main>

    <script>
        const rotateIntervalMs = 5000;
        const carouselStates = [];

        function getWeekNo(date) {
            const startOfYear = new Date(date.getFullYear(), 0, 1);
            const dayOfYear = Math.floor((date - startOfYear) / 86400000) + 1;
            const week = Math.ceil(dayOfYear / 7);
            const yearLastDigit = String(date.getFullYear()).slice(-1);

            return `W${yearLastDigit}${String(week).padStart(2, "0")}`;
        }

        function updateDateTime() {
            const now = new Date();
            document.getElementById("weekNo").textContent = getWeekNo(now);
            document.getElementById("currentTime").textContent = now.toLocaleTimeString([], {
                hour: "2-digit",
                minute: "2-digit",
                second: "2-digit"
            });
        }

        function createPlaceholder() {
            const frame = document.createElement("article");
            const placeholder = document.createElement("div");

            frame.className = "announce-frame";
            placeholder.className = "announce-placeholder";
            placeholder.textContent = "Image Placeholder";
            frame.appendChild(placeholder);

            return frame;
        }

        function createImageFrame(src) {
            const frame = document.createElement("article");
            const img = document.createElement("img");

            frame.className = "announce-frame";
            img.src = src;
            img.alt = "Announcement slide";
            img.onerror = () => {
                frame.replaceWith(createPlaceholder());
            };
            frame.appendChild(img);

            return frame;
        }

        function readTextSources(text) {
            return text
                .split(/[\n,]+/)
                .map(source => source.trim())
                .filter(Boolean);
        }

        function readSlideSource(node) {
            return node.getAttribute("src") || node.getAttribute("href") || node.textContent.trim();
        }

        function appendLayoutChildren(sourceParent, targetParent) {
            Array.from(sourceParent.childNodes).forEach(node => {
                if (node.nodeType === Node.TEXT_NODE) {
                    readTextSources(node.textContent).forEach(src => {
                        targetParent.appendChild(createImageFrame(src));
                    });
                    return;
                }

                if (node.nodeType !== Node.ELEMENT_NODE) {
                    return;
                }

                const tagName = node.tagName.toLowerCase();

                if (tagName === "stack") {
                    targetParent.appendChild(renderStack(node));
                    return;
                }

                if (tagName === "carousel") {
                    targetParent.appendChild(renderCarousel(node));
                    return;
                }

                if (["slide", "image", "announcement-image"].includes(tagName)) {
                    const src = readSlideSource(node);

                    if (src) {
                        targetParent.appendChild(createImageFrame(src));
                    }
                }
            });
        }

        function renderStack(sourceStack) {
            const stack = document.createElement("section");

            stack.className = "announce-stack";
            appendLayoutChildren(sourceStack, stack);

            if (stack.children.length === 0) {
                stack.appendChild(createPlaceholder());
            }

            return stack;
        }

        function renderCarousel(sourceCarousel) {
            const carousel = document.createElement("section");
            const prevArrow = document.createElement("button");
            const nextArrow = document.createElement("button");
            const state = {
                currentSlide: 0,
                timer: null,
                slides: []
            };

            carousel.className = "announce-carousel";
            prevArrow.className = "carousel-arrow carousel-prev";
            prevArrow.type = "button";
            prevArrow.setAttribute("aria-label", "Previous announcement");
            prevArrow.textContent = "<";
            nextArrow.className = "carousel-arrow carousel-next";
            nextArrow.type = "button";
            nextArrow.setAttribute("aria-label", "Next announcement");
            nextArrow.textContent = ">";

            appendLayoutChildren(sourceCarousel, carousel);
            state.slides = Array.from(carousel.querySelectorAll(":scope > .announce-frame"));

            if (state.slides.length === 0) {
                carousel.appendChild(createPlaceholder());
                state.slides = Array.from(carousel.querySelectorAll(":scope > .announce-frame"));
            }

            carousel.appendChild(prevArrow);
            carousel.appendChild(nextArrow);
            carouselStates.push(state);

            function showSlide(index, restartTimer) {
                if (state.slides.length === 0) {
                    return;
                }

                state.currentSlide = (index + state.slides.length) % state.slides.length;
                state.slides.forEach((slide, slideIndex) => {
                    slide.classList.toggle("active-slide", slideIndex === state.currentSlide);
                });

                if (restartTimer) {
                    startCarouselTimer(state);
                }
            }

            prevArrow.addEventListener("click", () => showSlide(state.currentSlide - 1, true));
            nextArrow.addEventListener("click", () => showSlide(state.currentSlide + 1, true));
            showSlide(0, false);
            startCarouselTimer(state);

            return carousel;
        }

        function startCarouselTimer(state) {
            clearInterval(state.timer);

            if (state.slides.length > 1) {
                state.timer = setInterval(() => {
                    state.currentSlide = (state.currentSlide + 1) % state.slides.length;
                    state.slides.forEach((slide, slideIndex) => {
                        slide.classList.toggle("active-slide", slideIndex === state.currentSlide);
                    });
                }, rotateIntervalMs);
            }
        }

        function renderAnnouncementTemplate() {
            const output = document.getElementById("announcementOutput");
            const template = document.getElementById("announcementTemplate");

            carouselStates.forEach(state => clearInterval(state.timer));
            carouselStates.length = 0;
            output.innerHTML = "";
            appendLayoutChildren(template.content, output);

            if (output.children.length === 0) {
                output.appendChild(createPlaceholder());
            }
        }

        function setupDownloadLink() {
            const link = document.getElementById("downloadLink");
            const name = document.getElementById("downloadName");
            
            const fileName = link.getAttribute("href").split("/").pop();

            name.textContent = fileName;
            link.download = fileName; 
        }

        updateDateTime();
        setInterval(updateDateTime, 1000);
        renderAnnouncementTemplate();
        setupDownloadLink();
    </script>
</body>
</html>
