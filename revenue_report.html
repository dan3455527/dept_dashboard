<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Revenue Report</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: transparent;
            padding: 20px;
        }
        .card {
            border: none;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            margin-bottom: 20px;
            background-color: #f8f9fa;
        }
    </style>
</head>
<body>
    <div class="container-fluid">
        <h2 class="mb-4 text-success">Revenue Report</h2>
        <div class="row">
            <div class="col-md-6">
                <div class="card p-4 text-center border-success border-start border-5">
                    <h4>Monthly Revenue</h4>
                    <h2 class="text-success">$45,230.00</h2>
                </div>
            </div>
            <div class="col-md-6">
                <div class="card p-4 text-center border-primary border-start border-5">
                    <h4>Annual Projection</h4>
                    <h2 class="text-primary">$542,000.00</h2>
                </div>
            </div>
        </div>
        <div class="row">
            <div class="col-12">
                <div class="card p-4">
                    <h5 class="mb-3">Recent Transactions</h5>
                    <table class="table table-striped table-hover">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Client</th>
                                <th>Amount</th>
                                <th>Status</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td>#1001</td>
                                <td>Acme Corp</td>
                                <td>$1,200.00</td>
                                <td><span class="badge bg-success">Completed</span></td>
                            </tr>
                            <tr>
                                <td>#1002</td>
                                <td>Globex</td>
                                <td>$3,400.00</td>
                                <td><span class="badge bg-success">Completed</span></td>
                            </tr>
                            <tr>
                                <td>#1003</td>
                                <td>Soylent Corp</td>
                                <td>$800.00</td>
                                <td><span class="badge bg-warning text-dark">Pending</span></td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
